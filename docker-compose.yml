services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bhashabridge-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/interpret
    container_name: bhashabridge-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped